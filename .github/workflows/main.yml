name: Build mod jar
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 25 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.8.2 }
      # Upload surgelyrics.zip (any name starting with "surgelyrics", any folder, do not extract it). The newest zip in the repo is built.
      - name: Find the project
        run: |
          best=""; bt=-1
          while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f"); t=${t:-0}
            if [ "$t" -ge "$bt" ]; then bt=$t; best=$f; fi
          done < <(find . -path ./build_src -prune -o -type f -iname 'surgelyrics*.zip' -print0)
          if [ -n "$best" ]; then
            echo "project zip: $best"
            rm -rf build_src && mkdir build_src && unzip -q "$best" -d build_src
            gradle_file=$(find build_src -name settings.gradle | head -1)
            if [ -z "$gradle_file" ]; then echo "::error::The zip has no settings.gradle inside. Upload the surgelyrics zip I gave you, unextracted."; exit 1; fi
            echo "PROJECT_DIR=$(dirname "$gradle_file")" >> "$GITHUB_ENV"
          elif [ -f settings.gradle ]; then
            echo "no zip found, building the loose files in the repo"
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "::error::No surgelyrics zip found in this repo. Upload surgelyrics.zip with Add file > Upload files (do not extract it)."
            exit 1
          fi
      - name: Check every font file is present
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          n=$(ls mc1_21_11/src/main/resources/assets/surgelyrics/font/*.ttf | wc -l)
          j=$(ls mc1_21_11/src/main/resources/assets/surgelyrics/font/*.json | wc -l)
          echo "fonts: $n ttf, $j json"
          test "$n" -ge 34 && test "$j" -ge 34
          p=$(ls mc1_21_11/src/main/resources/assets/surgelyrics/packs/*.zip | wc -l)
          echo "texture packs: $p"
          test "$p" -ge 10
      - name: Core tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir out && javac -d out $(find core/src -name '*.java') && java -cp out dev.surgelyrics.core.CoreTests
      - name: Build 1.21.11 jar
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :mc1_21_11:build --no-daemon
      - name: Check the jar contains the fonts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          jar=$(ls mc1_21_11/build/libs/surgeclient-*.jar | grep -v sources | head -1)
          echo "jar: $jar"
          unzip -l "$jar" | grep -c "assets/surgelyrics/font/.*ttf" || true
      - uses: actions/upload-artifact@v4
        with:
          name: surgeclient-1.21.11
          path: |
            ${{ env.PROJECT_DIR }}/mc1_21_11/build/libs/surgeclient-*.jar
            !${{ env.PROJECT_DIR }}/mc1_21_11/build/libs/*-sources.jar
